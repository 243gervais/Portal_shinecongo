server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.shinecongo.org;

    ssl_certificate /etc/letsencrypt/live/portal.shinecongo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.shinecongo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/portal-shinecongo.access.log;
    error_log /var/log/nginx/portal-shinecongo.error.log;
    client_max_body_size 100M;

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/portal-shinecongo/gunicorn.sock;
        proxy_read_timeout 300;
        proxy_connect_timeout 30;
    }
}
